name: Plugin Native Compatibility

on:
  push:
    branches: [main, codex/plugin-system]
    paths:
      - 'src-tauri/**'
      - 'sdk/**'
      - 'src/App.tsx'
      - 'src/components/plugins/**'
      - 'scripts/plugin-gui-*.py'
      - 'scripts/plugin-gui-*.ps1'
      - 'scripts/plugin-main-window-linux.py'
      - '.github/workflows/plugin-compat.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'sdk/**'
      - 'src/App.tsx'
      - 'src/components/plugins/**'
      - 'scripts/plugin-gui-*.py'
      - 'scripts/plugin-gui-*.ps1'
      - 'scripts/plugin-main-window-linux.py'
      - '.github/workflows/plugin-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - name: Install Linux native WebView and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb xauth dbus-x11 openbox xdotool wmctrl python3-pyatspi at-spi2-core imagemagick
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: backend
          save-if: false
      - name: Prepare frontend placeholder
        shell: bash
        run: mkdir -p dist
      - name: Check test hooks
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --features test-hooks -- -D warnings
      - name: Build native acceptance binary
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features test-hooks
      - name: Run native WebKitGTK acceptance
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
        run: timeout 180s dbus-run-session -- xvfb-run -a src-tauri/target/debug/cc-switch --plugin-compat-check "$PWD/plugin-compat-report.json"
      - name: Run native WebView2 acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'plugin-compat-report.json'
          $process = Start-Process -FilePath 'src-tauri/target/debug/cc-switch.exe' -ArgumentList @('--plugin-compat-check', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Native plugin acceptance timed out' }
          if ($process.ExitCode -ne 0) { throw "Native plugin acceptance exited with $($process.ExitCode)" }
      - name: Verify native evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          report = json.load(open('plugin-compat-report.json', encoding='utf-8'))
          print(json.dumps(report, indent=2))
          assert report['success'] and set(report['passed']) == {
              'native_webview_sdk_storage_providers_usage',
              'upgrade_preserves_data_grants_and_reopens_new_page',
              'infinite_loop_watchdog_host_remains_responsive',
              'restart_preserves_storage_and_child_crash_is_contained',
              'permission_denial_and_disable_terminate_runtime',
              'parent_crash_terminates_child',
          }, report
          assert report['launchDirectoryClean'] and report['launchDirectoryEntries'] == [], report
          assert report['childEnvironmentValidated'], report
          assert report['runtimeProfilesCleanBeforeParentCrash'], report
          assert report['parentCrashProfileRecoveryClean'], report
          PY
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install frontend dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Exercise main window on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/plugin-gui-home"
          evidence="$GITHUB_WORKSPACE/plugin-gui-evidence"
          mkdir -p "$evidence"
          python3 scripts/plugin-gui-fixture.py "$home"
          pnpm exec vite --host 127.0.0.1 --port 3000 --strictPort > "$evidence/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          timeout 180s dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' /usr/bin/python3 scripts/plugin-main-window-linux.py "$GITHUB_WORKSPACE/src-tauri/target/debug/cc-switch" "$home" "$evidence"
      - name: Exercise main window on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP 'plugin-gui-home'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'plugin-gui-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          python scripts/plugin-gui-fixture.py $homeDir
          if ($LASTEXITCODE -ne 0) { throw 'Fixture setup failed' }
          $vite = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', 'pnpm exec vite --host 127.0.0.1 --port 3000 --strictPort' -RedirectStandardOutput "$evidence/vite.log" -RedirectStandardError "$evidence/vite-error.log" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:3000/' | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Vite did not start' }
            & powershell -NoProfile -File scripts/plugin-gui-windows.ps1 -Binary (Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/debug/cc-switch.exe') -TestHome $homeDir -Report (Join-Path $evidence 'report.json')
            if ($LASTEXITCODE -ne 0) { throw 'Windows main-window acceptance failed' }
          } finally {
            & taskkill /PID $vite.Id /T /F 2>$null
          }
      - name: Verify main-window evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          report = json.load(open('plugin-gui-evidence/report.json', encoding='utf-8-sig'))
          print(json.dumps(report, indent=2))
          assert report['success'], report
          assert len(report['steps']) >= 4, report
          PY
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-native-${{ matrix.os }}
          path: |
            plugin-compat-report.json
            plugin-compat-logs/
            plugin-gui-evidence/
          retention-days: 7
